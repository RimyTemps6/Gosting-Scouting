<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghosting Scouting</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--ac:#f97316;--font:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
html[data-mode=dark]{--bg:#0f1115;--card:#181b22;--tx:#f1f5f9;--mu:#94a3b8;--bd:#2a2f3a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font)}
header{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:12px;flex:1;font-size:24px;font-weight:800;letter-spacing:-.5px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:20px}
.pill{background:var(--ac);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:0}
.um{position:relative}.uc{display:flex;align-items:center;gap:12px;cursor:pointer;text-align:right}.uc small{display:block;color:var(--mu)}.uc img{width:42px;height:42px;border-radius:50%}
.menu{position:absolute;right:0;top:54px;width:250px;background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 10px 30px #0002;z-index:9;padding:6px 0}
.menu .mh{padding:12px 16px;border-bottom:1px solid var(--bd)}.mh small{display:block;color:var(--mu)}.menu a{display:block;padding:11px 16px;cursor:pointer}.menu a:hover{background:var(--bg)}
nav{display:flex;gap:6px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--bd);overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;border-radius:0;color:var(--tx);padding:15px 16px;font:inherit;font-weight:500;white-space:nowrap;cursor:pointer}
nav button.on{border-color:var(--ac);color:var(--ac);font-weight:700}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 18px;cursor:pointer;font:inherit;font-weight:600}
button.g{background:transparent;border:1px solid var(--bd);color:var(--tx);font-weight:500}
main{padding:22px 24px;max-width:1200px;margin:auto}h2{font-size:26px;margin:18px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}.card h3{margin:14px 0 8px}.card h3:first-child{margin-top:0}
.banner{display:flex;align-items:center;gap:18px;max-width:640px;padding:20px 24px;border:1.5px solid #fdba74;border-radius:14px;background:linear-gradient(135deg,#ffedd5,#fed7aa);color:#0f172a;cursor:pointer;box-shadow:0 4px 14px #f9731622}
html[data-mode=dark] .banner{background:#f9731626;color:var(--tx)}.banner h3{margin:0 0 4px;font-size:20px}.banner p{margin:0;opacity:.8}
.bi{width:56px;height:56px;border-radius:12px;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:30px;flex:none}
input,select,textarea{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}label{font-size:12px;color:var(--mu);display:block;margin:4px 0 3px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);white-space:nowrap}th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--bd);font-size:14px}
.stat{text-align:left;margin:0}.stat small{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.5px}.stat b{display:block;font-size:32px;color:var(--ac);margin:4px 0}.stat span{color:var(--mu);font-size:13px}
.msg{padding:12px 14px;border-radius:12px;margin:8px 0;white-space:pre-wrap}.u{background:var(--bg)}.a{background:#f9731618;border:1px solid #f9731640}
img.th{max-width:150px;border-radius:10px}.c{text-align:center;margin-top:12vh}.c h1{font-size:36px}pre{white-space:pre-wrap;font-size:12px}summary{cursor:pointer;font-weight:600}
</style></head><body>
<header><div class="brand"><span class="logo">G</span>Ghosting Scouting<span class="pill">BETA</span></div><div class="um" id="um"></div></header>
<nav id="nav"></nav><main id="main"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),M=$('#main');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();
let U,T,TD,ROLE,subs=[],D={matches:[],pits:[],docs:[],members:[],requests:[]},tab='painel',chat=[];
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},ss=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
/* ---------- tema ---------- */
function applyTheme(){const t=ls('theme',{});const r=document.documentElement;r.dataset.mode=t.mode||'light';['bg','card','tx','ac','font'].forEach(k=>t[k]?r.style.setProperty('--'+k,t[k]):r.style.removeProperty('--'+k))}applyTheme();
/* ---------- auth ---------- */
const login=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>alert(e.message));
const rulesBtn=`<button class="g" onclick="showRules()">Regras do Firebase</button>`;
async function showRules(){let t='';try{t=await (await fetch('firestore.rules')).text()}catch{t='Abra pelo GitHub Pages para ver as regras (ou use o arquivo firestore.rules).'}
 M.innerHTML=`<div class="card"><h3>Regras do Firestore</h3><button onclick="copyR()"> Copiar tudo</button> <button class="g" onclick="location.reload()">Voltar</button>
 <textarea id="rt" rows="22" readonly onclick="this.select()">${esc(t)}</textarea></div>`}
function copyR(){const t=$('#rt');t.select();navigator.clipboard.writeText(t.value).then(()=>alert('Copiado!'))}
auth.onAuthStateChanged(async u=>{U=u;subs.forEach(f=>f());subs=[];userMenu();
 if(!u){$('#nav').innerHTML='';M.innerHTML=`<div class="c"><h1> Ghosting Scouting</h1><p>Equipe brainMachine 17728</p><button onclick="login()">Entrar com Google</button> ${rulesBtn}</div>`;return}
 const us=await db.doc('users/'+u.uid).get();T=us.exists?us.data().teamId:null;
 if(!T)return noTeam();
 const m=await db.doc(`teams/${T}/members/${u.uid}`).get();
 if(m.exists)return enter(m.data().role);
 const r=await db.doc(`teams/${T}/requests/${u.uid}`).get();
 if(r.exists){M.innerHTML=`<div class="c"><h2> Aguardando aprovação</h2><p>Peça ao admin da equipe para aprovar seu acesso.</p><button class="g" onclick="leave()">Cancelar pedido</button></div>`;
  subs.push(db.doc(`teams/${T}/members/${u.uid}`).onSnapshot(s=>s.exists&&location.reload()));return}
 noTeam()});
async function leave(){await db.doc(`teams/${T}/requests/${U.uid}`).delete().catch(()=>{});await db.doc('users/'+U.uid).delete();location.reload()}
function noTeam(){M.innerHTML=`<div class="grid"><div class="card"><h3>Criar equipe</h3><label>Nome</label><input id="tn" value="brainMachine"><label>Número</label><input id="tnum" value="17728"><br><br><button onclick="createTeam()">Criar (você será admin)</button></div>
 <div class="card"><h3>Entrar em uma equipe</h3><label>ID da equipe (o admin vê na aba Equipe)</label><input id="tid"><br><br><button onclick="joinTeam()">Pedir permissão</button></div></div>`}
async function createTeam(){const ref=db.collection('teams').doc();
 await ref.set({name:$('#tn').value,number:$('#tnum').value,ownerId:U.uid,ts:Date.now()});
 await ref.collection('members').doc(U.uid).set({role:'admin',name:U.displayName,email:U.email});
 await db.doc('users/'+U.uid).set({teamId:ref.id});location.reload()}
async function joinTeam(){const id=$('#tid').value.trim();const t=await db.doc('teams/'+id).get().catch(()=>null);
 if(!t||!t.exists)return alert('Equipe não encontrada');
 await db.doc(`teams/${id}/requests/${U.uid}`).set({name:U.displayName,email:U.email,ts:Date.now()});
 await db.doc('users/'+U.uid).set({teamId:id});location.reload()}
/* ---------- app ---------- */
async function enter(role){ROLE=role;TD=(await db.doc('teams/'+T).get()).data();
 ['matches','pits','docs'].forEach(c=>subs.push(db.collection(`teams/${T}/${c}`).orderBy('ts','desc').onSnapshot(s=>{D[c]=s.docs.map(d=>({id:d.id,...d.data()}));if(['painel','scout','pit','analise','docs'].includes(tab))render(true)})));
 subs.push(db.collection(`teams/${T}/members`).onSnapshot(s=>{D.members=s.docs.map(d=>({id:d.id,...d.data()}));tab==='equipe'&&render(true)}));
 if(role==='admin')subs.push(db.collection(`teams/${T}/requests`).onSnapshot(s=>{D.requests=s.docs.map(d=>({id:d.id,...d.data()}));tab==='equipe'&&render(true)}));
 const tabs=[['painel','Painel'],['scout','Reconhecimento'],['pit','Pit'],['analise','Análise'],['ia','IA'],['docs','Biblioteca'],['equipe','Equipe'],['tema','Tema']];
 $('#nav').innerHTML=tabs.map(t=>`<button data-t="${t[0]}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');userMenu();render()}
function render(soft){if(soft&&['ia','tema'].includes(tab))return;if(soft&&document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));V[tab]()}
const num=id=>+($('#'+id).value)||0;
const opt=a=>a.map(x=>`<option>${x}</option>`).join('');
const V={
painel(){const nt=new Set(D.matches.map(x=>x.team)).size;
 M.innerHTML=`<div class="banner" onclick="tab='scout';render()"><span class="bi">+</span><div><h3>Comece o reconhecimento</h3><p>Acompanhe e analise o desempenho das equipes durante as partidas.</p></div></div>
 <h2>Visão geral da equipe</h2><div class="grid"><div class="card stat"><small>Partidas</small><b>${D.matches.length}</b></div><div class="card stat"><small>Times</small><b>${nt}</b></div><div class="card stat"><small>Pit scouts</small><b>${D.pits.length}</b></div><div class="card stat"><small>Membros</small><b>${D.members.length}</b></div></div>
 <div class="card tw"><h3>Últimas partidas</h3><table><tr><th>Time</th><th>Partida</th><th>Resultado</th><th>Pontos</th><th>Por</th></tr>${D.matches.slice(0,8).map(m=>`<tr><td>${esc(m.team)}</td><td>${m.m||''}</td><td>${esc(m.result||'')}</td><td>${(m.auto||0)+(m.tele||0)+(m.end||0)}</td><td>${esc(m.by)}</td></tr>`).join('')}</table></div>`},
scout(){const sel=(id,l,a)=>`<div><label>${l}</label><select id="${id}">${opt(a)}</select></div>`,inp=(id,l,v='0',t='number')=>`<div><label>${l}</label><input id="${id}" type="${t}" value="${v}"></div>`;
 M.innerHTML=`<h2>Reconhecimento de partida</h2><div class="card"><h3>Partida</h3><div class="grid">${inp('f_team','Time #','','text')}${inp('f_m','Partida #','')}${inp('f_p','Time parceiro (aliança)','','text')}${sel('f_res','Resultado da partida',['Vitória','Derrota','Empate'])}</div>
 <h3>Pontuação</h3><div class="grid">${inp('f_a','Pontos autônomo')}${inp('f_t','Pontos TeleOp')}${inp('f_e','Pontos endgame')}${inp('f_c','Ciclos')}</div>
 <h3>Jogo</h3><div class="grid">${inp('f_dr','Vezes que derrubou célula')}${sel('f_fl','Coleta dentro da flor',['Sim','Não'])}${inp('f_sh','Elementos que atira','','text')}${sel('f_au','Possui autônomo',['Sim','Parcial','Não'])}${sel('f_br','Robô quebrou',['Não','Sim'])}</div>
 <h3>Eficiência</h3><div class="grid">${inp('f_ca','Tentativas de coleta')}${inp('f_co','Coletas bem-sucedidas')}${inp('f_ta','Tiros tentados')}${inp('f_th','Tiros certos')}${inp('f_pl','Habilidade dos pilotos (1-5)','3')}${inp('f_r','Confiabilidade (1-5)','3')}</div>
 <label>Observações</label><textarea id="f_n" rows="3"></textarea><br><button onclick="saveMatch()">Salvar partida</button></div>
 <div class="card tw"><table><tr><th>Time</th><th>Partida</th><th>Resultado</th><th>Pontos</th><th>Derrub.</th><th>Quebrou</th><th>Obs</th><th>Por</th><th></th></tr>${D.matches.map(m=>`<tr><td>${esc(m.team)}</td><td>${m.m||''}</td><td>${esc(m.result||'')}</td><td>${(m.auto||0)+(m.tele||0)+(m.end||0)}</td><td>${m.drops||0}</td><td>${m.broke||'Não'}</td><td>${esc(m.notes)}</td><td>${esc(m.by)}</td><td><button class="g" onclick="del('matches','${m.id}')">✕</button></td></tr>`).join('')}</table></div>`},
pit(){const sel=(id,l,a)=>`<div><label>${l}</label><select id="${id}">${opt(a)}</select></div>`;
 M.innerHTML=`<h2>Pit scouting</h2><div class="card"><div class="grid"><div><label>Time #</label><input id="p_team"></div><div><label>Nome</label><input id="p_name"></div>
 ${sel('p_base','Tipo de base',['Mecanum','Tração 4x4','Swerve','Tank','Outra'])}${sel('p_sh','Tipo de shooter',['Flywheel único','Flywheel duplo','Turret','Hood ajustável','Outro','Não possui'])}${sel('p_rt','Tipo de robô',['Atirador','Coletor','Híbrido','Defesa'])}<div><label>Linguagem</label><input id="p_lang"></div></div>
 <label>Mecanismos / capacidades</label><textarea id="p_mech" rows="2"></textarea><label>Foto do robô</label><input type="file" id="p_img" accept="image/*"><br><br><button onclick="savePit()">Salvar</button></div>
 ${D.pits.map(p=>`<div class="card"><b>${esc(p.team)} - ${esc(p.name)}</b> <button class="g" onclick="del('pits','${p.id}')">✕</button><br>Base: ${esc(p.base||p.dt||'-')} | Shooter: ${esc(p.shooter||'-')} | Tipo: ${esc(p.rtype||'-')} | ${esc(p.lang)}<br>${esc(p.mech)}<br>${p.img?`<img class="th" src="${p.img}">`:''}</div>`).join('')}`},
analise(){const m={};D.matches.forEach(x=>{const a=m[x.team]||(m[x.team]={n:0,pts:0,dr:0,fl:0,au:0,br:0,ca:0,co:0,ta:0,th:0,tele:0,cy:0,pl:0,w:0,l:0,e:0});
 a.n++;a.pts+=(x.auto||0)+(x.tele||0)+(x.end||0);a.dr+=x.drops||0;a.fl+=x.flower==='Sim'?1:0;a.au+=x.hasAuto==='Sim'?1:0;a.br+=x.broke==='Sim'?1:0;a.ca+=x.collAtt||0;a.co+=x.coll||0;a.ta+=x.shotAtt||0;a.th+=x.shotHit||0;a.tele+=x.tele||0;a.cy+=x.cycles||0;a.pl+=x.driver||0;
 if(x.result==='Vitória')a.w++;else if(x.result==='Derrota')a.l++;else if(x.result==='Empate')a.e++});
 const p=(a,b)=>b?Math.round(100*a/b)+'%':'-',f=(a,n)=>n?(a/n).toFixed(1):'-',pit=t=>D.pits.find(x=>x.team==t)||{};
 const rows=Object.entries(m).map(([k,a])=>({k,a})).sort((x,y)=>y.a.pts/y.a.n-x.a.pts/x.a.n),tot=D.matches.length,sum=rows.reduce((s,r)=>s+r.a.pts,0);
 M.innerHTML=`<h2>Análise geral</h2><div class="grid"><div class="card stat"><small>Média geral de pontos</small><b>${f(sum,tot)}</b><span>${tot} partidas</span></div>${rows.slice(0,3).map((r,i)=>`<div class="card stat"><small>Top ${i+1}</small><b>${esc(r.k)}</b><span>${f(r.a.pts,r.a.n)} pts médios</span></div>`).join('')}</div>
 <div class="card tw"><h3>Ranking e eficiência por time</h3><table><tr><th>#</th><th>Time</th><th>Partidas</th><th>Média pts</th><th>Derrub./jogo</th><th>Flor</th><th>Autônomo</th><th>Quebras</th><th>Efic. coleta</th><th>Efic. tiro (pts/ciclo)</th><th>Acertos</th><th>Pilotos</th><th>V-D-E</th><th>Base</th><th>Shooter</th><th>Tipo</th></tr>
 ${rows.map((r,i)=>{const a=r.a,q=pit(r.k);return `<tr><td>${i+1}</td><td><b>${esc(r.k)}</b></td><td>${a.n}</td><td>${f(a.pts,a.n)}</td><td>${f(a.dr,a.n)}</td><td>${p(a.fl,a.n)}</td><td>${p(a.au,a.n)}</td><td>${p(a.br,a.n)}</td><td>${p(a.co,a.ca)}</td><td>${f(a.tele,a.cy)}</td><td>${p(a.th,a.ta)}</td><td>${f(a.pl,a.n)}</td><td>${a.w}-${a.l}-${a.e}</td><td>${esc(q.base||'-')}</td><td>${esc(q.shooter||'-')}</td><td>${esc(q.rtype||'-')}</td></tr>`}).join('')}</table></div>`},
ia(){const a=ls('ai',{base:'https://integrate.api.nvidia.com/v1',model:'meta/llama-3.1-70b-instruct',key:'',fk:'',fr:'',vis:false});
 M.innerHTML=`<div class="card"><details><summary> Configurar IA (salvo só neste navegador)</summary><div class="grid">
 <div><label>Provedor</label><select onchange="preset(this.value)"><option value="">Escolher...</option><option value="https://integrate.api.nvidia.com/v1|meta/llama-3.1-70b-instruct">NVIDIA</option><option value="https://openrouter.ai/api/v1|meta-llama/llama-3.1-70b-instruct">OpenRouter</option><option value="https://api.openai.com/v1|gpt-4o-mini">OpenAI</option></select></div>
 <div><label>Base URL (compatível OpenAI)</label><input id="a_b" value="${esc(a.base)}"></div><div><label>Modelo</label><input id="a_m" value="${esc(a.model)}"></div>
 <div><label>API key</label><input id="a_k" type="password" value="${esc(a.key)}"></div><div><label>Fish Audio key (voz)</label><input id="a_fk" type="password" value="${esc(a.fk)}"></div>
 <div><label>Fish voice reference_id</label><input id="a_fr" value="${esc(a.fr)}"></div></div>
 <label><input type="checkbox" id="a_v" style="width:auto" ${a.vis?'checked':''}> Modelo com visão (envia até 3 fotos da Biblioteca)</label><button onclick="saveAI()">Salvar</button></details></div>
 <div class="card" id="chat">${chat.map(chatHtml).join('')}</div><div class="card"><textarea id="q" rows="2" placeholder="Pergunte sobre regras, estratégia, quem escolher na aliança..."></textarea><br><button onclick="ask()">Enviar</button></div>`},
docs(){M.innerHTML=`<div class="card"><h3>Biblioteca da IA</h3><p>Envie PDFs, .txt/.md ou imagens. A IA consulta tudo isto + os dados de scouting.</p>
 <input type="file" id="d_f" accept=".pdf,.txt,.md,image/*" multiple><br><br><button onclick="upDocs()">Enviar arquivos</button> <span id="d_s"></span><hr>
 <label>Ou cole o texto das regras</label><input id="d_pn" placeholder="Título"><textarea id="d_pt" rows="4"></textarea><br><button onclick="pasteDoc()">Salvar texto</button></div>
 <div class="card">${D.docs.map(d=>`<div>${d.kind==='img'?'[imagem]':'[texto]'} ${esc(d.name)} <button class="g" onclick="del('docs','${d.id}')">✕</button></div>`).join('')||'Nada ainda.'}</div>`},
equipe(){M.innerHTML=`<div class="card"><h3>${esc(TD.name)} #${esc(TD.number)}</h3>ID para convidar: <b>${T}</b> <button onclick="navigator.clipboard.writeText('${T}')">Copiar</button>
 <p>${rulesBtn}</p></div>${ROLE==='admin'?`<div class="card"><h3>Pedidos de entrada</h3>${D.requests.map(r=>`<div>${esc(r.name)} (${esc(r.email)}) <button onclick="approve('${r.id}')">Aprovar</button> <button class="g" onclick="reject('${r.id}')">Recusar</button></div>`).join('')||'Nenhum pedido.'}</div>`:''}
 <div class="card"><h3>Membros</h3>${D.members.map(m=>`<div>${esc(m.name)} — ${m.role} ${ROLE==='admin'&&m.id!==U.uid?`<button class="g" onclick="del('members','${m.id}')">Remover</button>`:''}</div>`).join('')}</div>`},
tema(){const t=ls('theme',{});const c=(k,l,d)=>`<div><label>${l}</label><input type="color" id="t_${k}" value="${t[k]||d}"></div>`;
 M.innerHTML=`<div class="card"><h3>Personalizar</h3><div class="grid">${c('bg','Fundo','#f8fafc')}${c('card','Cartões','#ffffff')}${c('tx','Texto','#0f172a')}${c('ac','Destaque','#f97316')}
 <div><label>Fonte</label><select id="t_font">${['system-ui,sans-serif','Georgia,serif','"Courier New",monospace','Verdana,sans-serif'].map(f=>`<option ${t.font===f?'selected':''}>${esc(f)}</option>`).join('')}</select></div></div><br>
 <button onclick="saveTheme()">Aplicar</button> <button class="g" onclick="localStorage.removeItem('theme');applyTheme();render()">Restaurar</button></div>`}};

function userMenu(){const e=$('#um');if(!U){e.innerHTML='';return}
 e.innerHTML=`<div class="uc" onclick="$('#menu').hidden=!$('#menu').hidden"><span>${TD?`<b>${esc(TD.name)}</b><small>#${esc(TD.number)}</small>`:`<b>${esc(U.displayName)}</b>`}</span>${U.photoURL?`<img src="${esc(U.photoURL)}" referrerpolicy="no-referrer">`:''}</div>
 <div class="menu" id="menu" hidden><div class="mh"><b>${esc(U.displayName)}</b><small>${esc(U.email)}</small></div>${TD?`<a onclick="go('equipe')">Minha equipe</a><a onclick="go('tema')">Personalizar tema</a>`:''}<a onclick="toggleDark()">Modo escuro</a><a onclick="showRules()">Regras do Firebase</a><a onclick="auth.signOut()">Sair</a></div>`}
const go=t=>{tab=t;$('#menu').hidden=true;render()};
function toggleDark(){const t=ls('theme',{});t.mode=t.mode==='dark'?'light':'dark';ss('theme',t);applyTheme();$('#menu').hidden=true}
/* ---------- ações ---------- */
const del=(c,id)=>confirm('Apagar?')&&db.doc(`teams/${T}/${c}/${id}`).delete();
async function saveMatch(){const team=$('#f_team').value.trim();if(!team)return alert('Informe o time');const v=id=>$('#'+id).value;
 await db.collection(`teams/${T}/matches`).add({team,m:num('f_m'),partner:v('f_p'),result:v('f_res'),auto:num('f_a'),tele:num('f_t'),end:num('f_e'),cycles:num('f_c'),drops:num('f_dr'),flower:v('f_fl'),shoots:v('f_sh'),hasAuto:v('f_au'),broke:v('f_br'),collAtt:num('f_ca'),coll:num('f_co'),shotAtt:num('f_ta'),shotHit:num('f_th'),driver:num('f_pl'),rel:num('f_r'),notes:v('f_n'),by:U.displayName,ts:Date.now()});alert('Partida salva')}
const shrink=(f,w=700)=>new Promise(ok=>{const i=new Image();i.onload=()=>{const s=Math.min(1,w/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};i.src=URL.createObjectURL(f)});
async function savePit(){const f=$('#p_img').files[0],v=id=>$('#'+id).value;await db.collection(`teams/${T}/pits`).add({team:v('p_team'),name:v('p_name'),base:v('p_base'),shooter:v('p_sh'),rtype:v('p_rt'),lang:v('p_lang'),mech:v('p_mech'),img:f?await shrink(f):'',ts:Date.now()});alert('Pit salvo')}
async function addText(name,text){for(let i=0;i<text.length;i+=250000)await db.collection(`teams/${T}/docs`).add({name:name+(text.length>250000?` (parte ${i/250000+1})`:''),kind:'text',text:text.slice(i,i+250000),ts:Date.now()+i})}
async function upDocs(){const fs=[...$('#d_f').files];for(const f of fs){$('#d_s').textContent='Processando '+f.name+'...';
  if(f.type.startsWith('image/'))await db.collection(`teams/${T}/docs`).add({name:f.name,kind:'img',img:await shrink(f,900),ts:Date.now()});
  else if(f.name.toLowerCase().endsWith('.pdf')){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
   const p=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';for(let i=1;i<=p.numPages;i++){t+=`\n[pág ${i}] `+(await(await p.getPage(i)).getTextContent()).items.map(x=>x.str).join(' ')}await addText(f.name,t)}
  else await addText(f.name,await f.text())}$('#d_s').textContent=' Pronto'}
const pasteDoc=()=>addText($('#d_pn').value||'Regras',$('#d_pt').value).then(()=>$('#d_pt').value='');
const approve=async id=>{const r=D.requests.find(x=>x.id===id);await db.doc(`teams/${T}/members/${id}`).set({role:'member',name:r.name,email:r.email});await db.doc(`teams/${T}/requests/${id}`).delete()};
const reject=id=>db.doc(`teams/${T}/requests/${id}`).delete();
function saveTheme(){ss('theme',{...ls('theme',{}),bg:$('#t_bg').value,card:$('#t_card').value,tx:$('#t_tx').value,ac:$('#t_ac').value,font:$('#t_font').value});applyTheme()}
/* ---------- IA ---------- */
function preset(v){if(!v)return;const[b,m]=v.split('|');$('#a_b').value=b;$('#a_m').value=m}
function saveAI(){ss('ai',{base:$('#a_b').value.replace(/\/$/,''),model:$('#a_m').value,key:$('#a_k').value,fk:$('#a_fk').value,fr:$('#a_fr').value,vis:$('#a_v').checked});alert('Salvo')}
const chatHtml=(m,i)=>`<div class="msg ${m.role==='user'?'u':'a'}">${esc(m.content)}${m.role!=='user'?` <button class="g" onclick="speak(${i})">Ouvir</button>`:''}</div>`;
function context(){const sc=D.matches.slice(0,150).map(m=>`T${m.team} P${m.m} ${m.result||""} parceiro ${m.partner||""}: auto${m.auto} tele${m.tele} end${m.end} ciclos${m.cycles} derrubou${m.drops||0} flor:${m.flower||""} atira:${m.shoots||""} autonomo:${m.hasAuto||""} quebrou:${m.broke||""} coleta ${m.coll||0}/${m.collAtt||0} tiros ${m.shotHit||0}/${m.shotAtt||0} piloto${m.driver||""} "${m.notes}"`).join('\n');
 const pit=D.pits.map(p=>`T${p.team} ${p.name}: base ${p.base}, shooter ${p.shooter}, tipo ${p.rtype}, ${p.lang}, ${p.mech}`).join('\n');
 let docs='';for(const d of D.docs.filter(d=>d.kind==='text')){if(docs.length>90000)break;docs+=`\n### ${d.name}\n${d.text}`}
 return `Você é o assistente de scouting FTC da equipe ${TD.name} #${TD.number} (Ghosting Scouting). Responda em português, usando os dados abaixo e citando o documento quando usar regras.\n\n## PARTIDAS\n${sc}\n\n## PIT\n${pit}\n\n## DOCUMENTOS${docs.slice(0,90000)}`}
async function ask(){const a=ls('ai',{});if(!a.key)return alert('Configure a API key');const q=$('#q').value.trim();if(!q)return;$('#q').value='';
 chat.push({role:'user',content:q});render();const msgs=[{role:'system',content:context()},...chat.slice(-10)];
 if(a.vis){const im=D.docs.filter(d=>d.kind==='img').slice(0,3).map(d=>({type:'image_url',image_url:{url:d.img}}));if(im.length)msgs[msgs.length-1]={role:'user',content:[{type:'text',text:q},...im]}}
 try{const r=await fetch(a.base+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+a.key},body:JSON.stringify({model:a.model,messages:msgs,max_tokens:1200})});
  const j=await r.json();chat.push({role:'assistant',content:j.choices?.[0]?.message?.content||JSON.stringify(j)})}
 catch(e){chat.push({role:'assistant',content:'Erro: '+e.message+' (se for CORS, use um proxy ou OpenRouter)'})}render()}
async function speak(i){const a=ls('ai',{});if(!a.fk)return alert('Configure a Fish Audio key');
 try{const r=await fetch('https://api.fish.audio/v1/tts',{method:'POST',headers:{Authorization:'Bearer '+a.fk,'Content-Type':'application/json'},body:JSON.stringify({text:chat[i].content.slice(0,1500),reference_id:a.fr||undefined,format:'mp3'})});
  if(!r.ok)throw new Error(r.status);new Audio(URL.createObjectURL(await r.blob())).play()}catch(e){alert('Erro Fish Audio: '+e.message)}}
</script></body></html>
