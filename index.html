<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ghosting Scouting</title>
<style>
:root{--bg:#0d0f1a;--card:#171a2b;--tx:#e8eaf6;--ac:#8b5cf6;--font:system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}header h1 span{color:var(--ac)}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
button.g{background:transparent;border:1px solid var(--ac);color:var(--tx)}button.on{outline:2px solid var(--tx)}
main{padding:16px;max-width:1000px;margin:auto}.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:14px}
input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid #ffffff30;border-radius:8px;padding:8px;font:inherit;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}label{font-size:12px;opacity:.8;display:block}
table{width:100%;border-collapse:collapse}th,td{padding:6px;text-align:left;border-bottom:1px solid #ffffff20;font-size:14px}
.msg{padding:10px;border-radius:10px;margin:6px 0;white-space:pre-wrap}.u{background:#ffffff15}.a{background:var(--ac)}
img.th{max-width:120px;border-radius:8px}.c{text-align:center;margin-top:12vh}pre{white-space:pre-wrap;font-size:12px}
</style></head><body>
<header><h1>👻 Ghosting <span>Scouting</span> <small style="opacity:.6">brainMachine 17728</small></h1><span id="who"></span><button class="g" id="out" onclick="auth.signOut()" hidden>Sair</button></header>
<nav id="nav"></nav><main id="main"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),M=$('#main');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();
let U,T,TD,ROLE,subs=[],D={matches:[],pits:[],docs:[],members:[],requests:[]},tab='partidas',chat=[];
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},ss=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
/* ---------- tema ---------- */
function applyTheme(){const t=ls('theme',{});const r=document.documentElement.style;
 ['bg','card','tx','ac','font'].forEach(k=>t[k]?r.setProperty('--'+k,t[k]):r.removeProperty('--'+k))}applyTheme();
/* ---------- auth ---------- */
const login=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>alert(e.message));
const rulesBtn=`<button class="g" onclick="showRules()">Regras do Firebase</button>`;
async function showRules(){let t='';try{t=await (await fetch('firestore.rules')).text()}catch{t='Abra pelo GitHub Pages para ver as regras (ou use o arquivo firestore.rules).'}
 M.innerHTML=`<div class="card"><h3>Regras do Firestore</h3><button onclick="copyR()">📋 Copiar tudo</button> <button class="g" onclick="location.reload()">Voltar</button>
 <textarea id="rt" rows="22" readonly onclick="this.select()">${esc(t)}</textarea></div>`}
function copyR(){const t=$('#rt');t.select();navigator.clipboard.writeText(t.value).then(()=>alert('Copiado!'))}
auth.onAuthStateChanged(async u=>{U=u;subs.forEach(f=>f());subs=[];$('#out').hidden=!u;$('#who').textContent=u?u.displayName:'';
 if(!u){$('#nav').innerHTML='';M.innerHTML=`<div class="c"><h1>👻 Ghosting Scouting</h1><p>Equipe brainMachine 17728</p><button onclick="login()">Entrar com Google</button> ${rulesBtn}</div>`;return}
 const us=await db.doc('users/'+u.uid).get();T=us.exists?us.data().teamId:null;
 if(!T)return noTeam();
 const m=await db.doc(`teams/${T}/members/${u.uid}`).get();
 if(m.exists)return enter(m.data().role);
 const r=await db.doc(`teams/${T}/requests/${u.uid}`).get();
 if(r.exists){M.innerHTML=`<div class="c"><h2>⏳ Aguardando aprovação</h2><p>Peça ao admin da equipe para aprovar seu acesso.</p><button class="g" onclick="leave()">Cancelar pedido</button></div>`;
  subs.push(db.doc(`teams/${T}/members/${u.uid}`).onSnapshot(s=>s.exists&&location.reload()));return}
 noTeam()});
async function leave(){await db.doc(`teams/${T}/requests/${U.uid}`).delete().catch(()=>{});await db.doc('users/'+U.uid).delete();location.reload()}
function noTeam(){M.innerHTML=`<div class="grid"><div class="card"><h3>Criar equipe</h3><label>Nome</label><input id="tn" value="brainMachine"><label>Número</label><input id="tnum" value="17728"><br><br><button onclick="createTeam()">Criar (você será admin)</button></div>
 <div class="card"><h3>Entrar em uma equipe</h3><label>ID da equipe (o admin vê na aba Equipe)</label><input id="tid"><br><br><button onclick="joinTeam()">Pedir permissão</button></div></div>`}
async function createTeam(){const ref=db.collection('teams').doc();
 await ref.set({name:$('#tn').value,number:$('#tnum').value,ownerId:U.uid,ts:Date.now()});
 await ref.collection('members').doc(U.uid).set({role:'admin',name:U.displayName,email:U.email});
 await db.doc('users/'+U.uid).set({teamId:ref.id});location.reload()}
async function joinTeam(){const id=$('#tid').value.trim();const t=await db.doc('teams/'+id).get().catch(()=>null);
 if(!t||!t.exists)return alert('Equipe não encontrada');
 await db.doc(`teams/${id}/requests/${U.uid}`).set({name:U.displayName,email:U.email,ts:Date.now()});
 await db.doc('users/'+U.uid).set({teamId:id});location.reload()}
/* ---------- app ---------- */
async function enter(role){ROLE=role;TD=(await db.doc('teams/'+T).get()).data();
 ['matches','pits','docs'].forEach(c=>subs.push(db.collection(`teams/${T}/${c}`).orderBy('ts','desc').onSnapshot(s=>{D[c]=s.docs.map(d=>({id:d.id,...d.data()}));if(['partidas','pit','ranking','docs'].includes(tab)&&c!=='x')render(true)})));
 subs.push(db.collection(`teams/${T}/members`).onSnapshot(s=>{D.members=s.docs.map(d=>({id:d.id,...d.data()}));tab==='equipe'&&render(true)}));
 if(role==='admin')subs.push(db.collection(`teams/${T}/requests`).onSnapshot(s=>{D.requests=s.docs.map(d=>({id:d.id,...d.data()}));tab==='equipe'&&render(true)}));
 const tabs=[['partidas','📋 Partidas'],['pit','🔧 Pit'],['ranking','🏆 Ranking'],['ia','🤖 IA'],['docs','📚 Biblioteca'],['equipe','👥 Equipe'],['tema','🎨 Tema']];
 $('#nav').innerHTML=tabs.map(t=>`<button class="g" data-t="${t[0]}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');render()}
function render(soft){if(soft&&['ia','tema'].includes(tab))return;if(soft&&document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));V[tab]()}
const num=id=>+($('#'+id).value)||0;
const V={
partidas(){M.innerHTML=`<div class="card"><h3>Nova partida</h3><div class="grid">
 <div><label>Time #</label><input id="f_team"></div><div><label>Partida #</label><input id="f_m" type="number"></div>
 <div><label>Pontos Auto</label><input id="f_a" type="number" value="0"></div><div><label>Pontos TeleOp</label><input id="f_t" type="number" value="0"></div>
 <div><label>Pontos Endgame</label><input id="f_e" type="number" value="0"></div><div><label>Ciclos</label><input id="f_c" type="number" value="0"></div>
 <div><label>Defesa (1-5)</label><input id="f_d" type="number" min="1" max="5" value="3"></div><div><label>Confiabilidade (1-5)</label><input id="f_r" type="number" min="1" max="5" value="3"></div>
 <div><label>Saiu da área no Auto?</label><select id="f_l"><option>Sim</option><option>Não</option></select></div>
 <div><label>Endgame</label><select id="f_lv"><option>Nenhum</option><option>Parcial</option><option>Completo</option></select></div></div>
 <label>Observações</label><textarea id="f_n" rows="2"></textarea><br><button onclick="saveMatch()">Salvar</button></div>
 <div class="card"><table><tr><th>Time</th><th>P</th><th>A/T/E</th><th>Ciclos</th><th>Obs</th><th>Por</th><th></th></tr>${D.matches.map(m=>`<tr><td>${esc(m.team)}</td><td>${m.m}</td><td>${m.auto}/${m.tele}/${m.end}</td><td>${m.cycles}</td><td>${esc(m.notes)}</td><td>${esc(m.by)}</td><td><button class="g" onclick="del('matches','${m.id}')">✕</button></td></tr>`).join('')}</table></div>`},
pit(){M.innerHTML=`<div class="card"><h3>Pit scouting</h3><div class="grid"><div><label>Time #</label><input id="p_team"></div><div><label>Nome</label><input id="p_name"></div>
 <div><label>Drivetrain</label><input id="p_dt"></div><div><label>Linguagem</label><input id="p_lang"></div></div>
 <label>Mecanismos / Capacidades</label><textarea id="p_mech" rows="2"></textarea><label>Foto do robô</label><input type="file" id="p_img" accept="image/*"><br><br><button onclick="savePit()">Salvar</button></div>
 ${D.pits.map(p=>`<div class="card"><b>${esc(p.team)} — ${esc(p.name)}</b> <button class="g" onclick="del('pits','${p.id}')">✕</button><br>${esc(p.dt)} · ${esc(p.lang)}<br>${esc(p.mech)}<br>${p.img?`<img class="th" src="${p.img}">`:''}</div>`).join('')}`},
ranking(){const m={};D.matches.forEach(x=>{const a=m[x.team]||(m[x.team]={n:0,t:0,c:0,r:0,d:0});a.n++;a.t+=x.auto+x.tele+x.end;a.c+=x.cycles;a.r+=x.rel;a.d+=x.def});
 const rows=Object.entries(m).map(([k,a])=>({k,n:a.n,t:a.t/a.n,c:a.c/a.n,r:a.r/a.n,d:a.d/a.n})).sort((a,b)=>b.t-a.t),f=v=>v.toFixed(1);
 M.innerHTML=`<div class="card"><h3>Ranking / Pick list</h3><table><tr><th>#</th><th>Time</th><th>Partidas</th><th>Pts médio</th><th>Ciclos</th><th>Confiab.</th><th>Defesa</th></tr>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.k)}</td><td>${r.n}</td><td>${f(r.t)}</td><td>${f(r.c)}</td><td>${f(r.r)}</td><td>${f(r.d)}</td></tr>`).join('')}</table></div>`},
ia(){const a=ls('ai',{base:'https://integrate.api.nvidia.com/v1',model:'meta/llama-3.1-70b-instruct',key:'',fk:'',fr:'',vis:false});
 M.innerHTML=`<div class="card"><details><summary>⚙️ Configurar IA (salvo só neste navegador)</summary><div class="grid">
 <div><label>Provedor</label><select onchange="preset(this.value)"><option value="">Escolher...</option><option value="https://integrate.api.nvidia.com/v1|meta/llama-3.1-70b-instruct">NVIDIA</option><option value="https://openrouter.ai/api/v1|meta-llama/llama-3.1-70b-instruct">OpenRouter</option><option value="https://api.openai.com/v1|gpt-4o-mini">OpenAI</option></select></div>
 <div><label>Base URL (compatível OpenAI)</label><input id="a_b" value="${esc(a.base)}"></div><div><label>Modelo</label><input id="a_m" value="${esc(a.model)}"></div>
 <div><label>API key</label><input id="a_k" type="password" value="${esc(a.key)}"></div><div><label>Fish Audio key (voz)</label><input id="a_fk" type="password" value="${esc(a.fk)}"></div>
 <div><label>Fish voice reference_id</label><input id="a_fr" value="${esc(a.fr)}"></div></div>
 <label><input type="checkbox" id="a_v" style="width:auto" ${a.vis?'checked':''}> Modelo com visão (envia até 3 fotos da Biblioteca)</label><button onclick="saveAI()">Salvar</button></details></div>
 <div class="card" id="chat">${chat.map(chatHtml).join('')}</div><div class="card"><textarea id="q" rows="2" placeholder="Pergunte sobre regras, estratégia, quem escolher na aliança..."></textarea><br><button onclick="ask()">Enviar</button></div>`},
docs(){M.innerHTML=`<div class="card"><h3>Biblioteca da IA</h3><p>Envie PDFs, .txt/.md ou imagens. A IA consulta tudo isto + os dados de scouting.</p>
 <input type="file" id="d_f" accept=".pdf,.txt,.md,image/*" multiple><br><br><button onclick="upDocs()">Enviar arquivos</button> <span id="d_s"></span><hr>
 <label>Ou cole o texto das regras</label><input id="d_pn" placeholder="Título"><textarea id="d_pt" rows="4"></textarea><br><button onclick="pasteDoc()">Salvar texto</button></div>
 <div class="card">${D.docs.map(d=>`<div>${d.kind==='img'?'🖼️':'📄'} ${esc(d.name)} <button class="g" onclick="del('docs','${d.id}')">✕</button></div>`).join('')||'Nada ainda.'}</div>`},
equipe(){M.innerHTML=`<div class="card"><h3>${esc(TD.name)} #${esc(TD.number)}</h3>ID para convidar: <b>${T}</b> <button onclick="navigator.clipboard.writeText('${T}')">Copiar</button>
 <p>${rulesBtn}</p></div>${ROLE==='admin'?`<div class="card"><h3>Pedidos de entrada</h3>${D.requests.map(r=>`<div>${esc(r.name)} (${esc(r.email)}) <button onclick="approve('${r.id}')">Aprovar</button> <button class="g" onclick="reject('${r.id}')">Recusar</button></div>`).join('')||'Nenhum pedido.'}</div>`:''}
 <div class="card"><h3>Membros</h3>${D.members.map(m=>`<div>${esc(m.name)} — ${m.role} ${ROLE==='admin'&&m.id!==U.uid?`<button class="g" onclick="del('members','${m.id}')">Remover</button>`:''}</div>`).join('')}</div>`},
tema(){const t=ls('theme',{});const c=(k,l,d)=>`<div><label>${l}</label><input type="color" id="t_${k}" value="${t[k]||d}"></div>`;
 M.innerHTML=`<div class="card"><h3>Personalizar</h3><div class="grid">${c('bg','Fundo','#0d0f1a')}${c('card','Cartões','#171a2b')}${c('tx','Texto','#e8eaf6')}${c('ac','Destaque','#8b5cf6')}
 <div><label>Fonte</label><select id="t_font">${['system-ui,sans-serif','Georgia,serif','"Courier New",monospace','Verdana,sans-serif'].map(f=>`<option ${t.font===f?'selected':''}>${esc(f)}</option>`).join('')}</select></div></div><br>
 <button onclick="saveTheme()">Aplicar</button> <button class="g" onclick="localStorage.removeItem('theme');applyTheme();render()">Restaurar</button></div>`}};
/* ---------- ações ---------- */
const del=(c,id)=>confirm('Apagar?')&&db.doc(`teams/${T}/${c}/${id}`).delete();
async function saveMatch(){const team=$('#f_team').value.trim();if(!team)return alert('Informe o time');
 await db.collection(`teams/${T}/matches`).add({team,m:num('f_m'),auto:num('f_a'),tele:num('f_t'),end:num('f_e'),cycles:num('f_c'),def:num('f_d'),rel:num('f_r'),leave:$('#f_l').value,level:$('#f_lv').value,notes:$('#f_n').value,by:U.displayName,ts:Date.now()})}
const shrink=(f,w=700)=>new Promise(ok=>{const i=new Image();i.onload=()=>{const s=Math.min(1,w/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};i.src=URL.createObjectURL(f)});
async function savePit(){const f=$('#p_img').files[0];await db.collection(`teams/${T}/pits`).add({team:$('#p_team').value,name:$('#p_name').value,dt:$('#p_dt').value,lang:$('#p_lang').value,mech:$('#p_mech').value,img:f?await shrink(f):'',ts:Date.now()})}
async function addText(name,text){for(let i=0;i<text.length;i+=250000)await db.collection(`teams/${T}/docs`).add({name:name+(text.length>250000?` (parte ${i/250000+1})`:''),kind:'text',text:text.slice(i,i+250000),ts:Date.now()+i})}
async function upDocs(){const fs=[...$('#d_f').files];for(const f of fs){$('#d_s').textContent='Processando '+f.name+'...';
  if(f.type.startsWith('image/'))await db.collection(`teams/${T}/docs`).add({name:f.name,kind:'img',img:await shrink(f,900),ts:Date.now()});
  else if(f.name.toLowerCase().endsWith('.pdf')){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
   const p=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';for(let i=1;i<=p.numPages;i++){t+=`\n[pág ${i}] `+(await(await p.getPage(i)).getTextContent()).items.map(x=>x.str).join(' ')}await addText(f.name,t)}
  else await addText(f.name,await f.text())}$('#d_s').textContent='✅ Pronto'}
const pasteDoc=()=>addText($('#d_pn').value||'Regras',$('#d_pt').value).then(()=>$('#d_pt').value='');
const approve=async id=>{const r=D.requests.find(x=>x.id===id);await db.doc(`teams/${T}/members/${id}`).set({role:'member',name:r.name,email:r.email});await db.doc(`teams/${T}/requests/${id}`).delete()};
const reject=id=>db.doc(`teams/${T}/requests/${id}`).delete();
function saveTheme(){ss('theme',{bg:$('#t_bg').value,card:$('#t_card').value,tx:$('#t_tx').value,ac:$('#t_ac').value,font:$('#t_font').value});applyTheme()}
/* ---------- IA ---------- */
function preset(v){if(!v)return;const[b,m]=v.split('|');$('#a_b').value=b;$('#a_m').value=m}
function saveAI(){ss('ai',{base:$('#a_b').value.replace(/\/$/,''),model:$('#a_m').value,key:$('#a_k').value,fk:$('#a_fk').value,fr:$('#a_fr').value,vis:$('#a_v').checked});alert('Salvo')}
const chatHtml=(m,i)=>`<div class="msg ${m.role==='user'?'u':'a'}">${esc(m.content)}${m.role!=='user'?` <button class="g" onclick="speak(${i})">🔊</button>`:''}</div>`;
function context(){const sc=D.matches.slice(0,150).map(m=>`T${m.team} P${m.m}: A${m.auto} T${m.tele} E${m.end} ciclos${m.cycles} def${m.def} conf${m.rel} ${m.level} "${m.notes}"`).join('\n');
 const pit=D.pits.map(p=>`T${p.team} ${p.name}: ${p.dt}, ${p.lang}, ${p.mech}`).join('\n');
 let docs='';for(const d of D.docs.filter(d=>d.kind==='text')){if(docs.length>90000)break;docs+=`\n### ${d.name}\n${d.text}`}
 return `Você é o assistente de scouting FTC da equipe ${TD.name} #${TD.number} (Ghosting Scouting). Responda em português, usando os dados abaixo e citando o documento quando usar regras.\n\n## PARTIDAS\n${sc}\n\n## PIT\n${pit}\n\n## DOCUMENTOS${docs.slice(0,90000)}`}
async function ask(){const a=ls('ai',{});if(!a.key)return alert('Configure a API key');const q=$('#q').value.trim();if(!q)return;$('#q').value='';
 chat.push({role:'user',content:q});render();const msgs=[{role:'system',content:context()},...chat.slice(-10)];
 if(a.vis){const im=D.docs.filter(d=>d.kind==='img').slice(0,3).map(d=>({type:'image_url',image_url:{url:d.img}}));if(im.length)msgs[msgs.length-1]={role:'user',content:[{type:'text',text:q},...im]}}
 try{const r=await fetch(a.base+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+a.key},body:JSON.stringify({model:a.model,messages:msgs,max_tokens:1200})});
  const j=await r.json();chat.push({role:'assistant',content:j.choices?.[0]?.message?.content||JSON.stringify(j)})}
 catch(e){chat.push({role:'assistant',content:'Erro: '+e.message+' (se for CORS, use um proxy ou OpenRouter)'})}render()}
async function speak(i){const a=ls('ai',{});if(!a.fk)return alert('Configure a Fish Audio key');
 try{const r=await fetch('https://api.fish.audio/v1/tts',{method:'POST',headers:{Authorization:'Bearer '+a.fk,'Content-Type':'application/json'},body:JSON.stringify({text:chat[i].content.slice(0,1500),reference_id:a.fr||undefined,format:'mp3'})});
  if(!r.ok)throw new Error(r.status);new Audio(URL.createObjectURL(await r.blob())).play()}catch(e){alert('Erro Fish Audio: '+e.message)}}
</script></body></html>
